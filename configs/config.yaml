# ============================================================
# RehabGuardian 10.0 — 针对你硬件的精确配置
# 硬件：RTX 4070 Laptop 8.6GB VRAM | WSL2 7.8GB RAM | i7-14700HX 12核
# ============================================================

project:
  name: "RehabGuardian"
  version: "10.0"
  seed: 42

# ---------- 数据路径 ----------
data:
  raw_root:         "/mnt/d/Camargo2021_Formatted_No_Arm/"
  processed_dir:    "/mnt/d/Camargo2021_Formatted_No_Arm/processed/"
  h5_path:          "/mnt/d/Camargo2021_Formatted_No_Arm/processed/dataset.h5"
  meta_path:        "/mnt/d/Camargo2021_Formatted_No_Arm/processed/metadata.json"
  # 若有原始 OpenSim 数据可选填
  # raw_opensim_root: "/mnt/d/Subjects_Part1_AB06-AB14/"
  original_fps: 200
  target_fps:   60
  sequence_length: 20
  future_k:        10
  vis_len:          5
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15

# ---------- 模型参数 ----------
stgcn:
  num_nodes:       33
  in_channels:      3
  num_frames:       5
  hidden_channels: [64, 128, 256]    # 参数量 ~5.2M，<8M 限制
  output_dim:      23
  output_dim_aux:  84
  dropout:        0.10

fno:
  input_dim:  72     # ja(23)+vel(23)+acc(23)+com(3)
  output_dim: 12     # grf_l(6)+grf_r(6)
  future_k:   10     # 预测未来 10 帧 ≈ 167ms 预警窗口
  modes:      12
  width:      64
  depth:       4
  seq_len:    20

risk:
  input_dim:        35     # ja(23)+grf(12)
  input_dim_physio: 37     # +hr(1)+sleep(1)
  hidden_dim:       64
  num_classes:       3
  seq_len:          20
  use_physio:       true
  knee_l_idx:        6
  knee_r_idx:       13
  knee_overext_rad: -0.0873
  knee_max_rad:      2.094
  knee_asymm_rad:    0.2618
  grf_bw_ratio:      1.5
  body_weight_kg:   70.0
  temporal_window:  10

# ---------- 训练参数（针对 8.6GB VRAM + 7.8GB RAM）----------
train:
  device: "cuda"

  # ★ 关键：batch_size
  # VRAM 占用估算：
  #   模型参数：~40MB（float32）
  #   batch=16, T=20, D=72: 16×20×72×4B = 1.5MB
  #   梯度 + 优化器状态: ~120MB
  #   激活值（ST-GCN前向）: ~200MB
  #   合计：< 400MB，留够 VRAM 余量
  # Windows 进程已占用 ~1.5GB VRAM，实际可用 ~7GB
  batch_size: 16          # 保守值，稳定运行；可尝试 24

  num_epochs:    100
  learning_rate:  0.001
  weight_decay:   0.0001
  patience:       15      # 比原来宽松，WSL2 磁盘 IO 慢会有抖动

  # ★ DataLoader workers
  # WSL2 下 num_workers>0 有 h5py 多进程问题，用 0（单进程）
  # prefetch_factor 设 2 预取
  num_workers:      0     # WSL2 h5py 多进程不稳定，用 0
  pin_memory:    true     # CUDA 加速 host→device 拷贝
  prefetch_factor:  2     # num_workers>0 时才生效

  checkpoint_dir: "./checkpoints/"
  log_dir:        "./logs/"

  loss_weights:
    joint_angles: 0.30
    marker:       0.10
    grf:          0.35
    risk:         0.20
    conf:         0.05

# ---------- 分阶段训练 ----------
stage_training:
  stage1_ratio: 0.30     # 前30% epoch 只训 ST-GCN
  stage2_ratio: 0.60     # 30-60% 冻结视觉训 FNO+Risk
  stage3_ratio: 1.00     # 60-100% 联合微调
  stage3_lr_scale: 0.10  # Stage3 学习率缩小 10 倍

scheduled_sampling:
  start_p:       1.0
  end_p:         0.3
  warmup_epochs: 10

# ---------- FNO 时延 ----------
temporal_lag:
  init_lag_frames: 3     # 初始 50ms @60Hz
  max_lag_frames: 12     # 最大 200ms

# ---------- 推理 ----------
inference:
  stgcn_ckpt: "./checkpoints/stgcn_best.pth"
  fno_ckpt:   "./checkpoints/fno_best.pth"
  risk_ckpt:  "./checkpoints/risk_best.pth"
  norm_stats: "/mnt/d/Camargo2021_Formatted_No_Arm/processed/norm_stats.npz"
  ood_stats:  "/mnt/d/Camargo2021_Formatted_No_Arm/processed/ood_stats.npz"
  pose_buffer_size:  5
  bio_buffer_size:  20
  smooth_window:     5

# ---------- 导出 ----------
export:
  onnx_dir: "./export/onnx/"
  mnn_dir:  "./export/mnn/"

# ---------- OPPO 健康 SDK ----------
oppo_health:
  enabled: true
  threshold_adjust_range: 0.2

# ---------- 数据版本 ----------
data_version:
  b3d_hash: ""
  raw_hash: ""
  created:  ""