project:
  name: "RehabGuardian"
  version: "10.0"
  seed: 42

data:
  raw_root: "/mnt/d/Camargo2021_Formatted_No_Arm/"
  processed_dir: "./data/processed/"
  original_fps: 200
  target_fps: 60
  sequence_length: 20
  stride: 1
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

# ProcessingPass 动态选择权重
pass_selection:
  w_marker_rms:           0.4
  w_residual_force:       0.3
  w_residual_torque:      0.2
  w_missing_marker_ratio: 0.1

stgcn:
  num_nodes: 33
  in_channels: 3
  num_frames: 5
  hidden_channels: [64, 128, 256]
  output_dim: 23          # 主任务：joint_angles
  output_dim_aux: 84      # 辅助任务：markers (28×3)
  dropout: 0.1

fno:
  input_dim: 72           # ja(23)+vel(23)+acc(23)+com(3)
  output_dim: 12          # grf_left(6)+grf_right(6)
  future_k: 10            # 预测未来帧数（@60Hz ≈ 167ms 预警窗口）
  modes: 12
  width: 64
  depth: 4
  seq_len: 20

risk:
  input_dim: 35           # joint_angles(23) + grf(12)
  input_dim_physio: 37    # + heart_rate(1) + sleep_score(1)
  hidden_dim: 64
  num_classes: 3
  seq_len: 20
  use_physio: true
  knee_l_idx: 6
  knee_r_idx: 13
  knee_overext_rad: -0.0873
  knee_max_rad: 2.094
  knee_asymm_rad: 0.2618
  grf_bw_ratio: 1.5
  body_weight_kg: 70.0
  temporal_window: 10     # SafetyHeartbeat 时间累积窗口

train:
  device: "cuda"
  batch_size: 24
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  warmup_epochs: 5
  checkpoint_dir: "./checkpoints/"
  log_dir: "./logs/"
  loss_weights:
    joint_angles: 0.30    # ja 主任务
    marker:       0.10    # mk 辅助任务
    grf:          0.35    # FNO GRF 预测
    risk:         0.20    # Risk 分类
    conf:         0.05    # 置信度校准

# Scheduled Sampling
scheduled_sampling:
  start_p: 1.0            # 初始全用 GT
  end_p:   0.3            # 最终 70% 用预测
  warmup_epochs: 10

inference:
  stgcn_ckpt: "./checkpoints/stgcn_best.pth"
  fno_ckpt:   "./checkpoints/fno_best.pth"
  risk_ckpt:  "./checkpoints/risk_best.pth"
  norm_stats: "./data/processed/norm_stats.npz"
  ood_stats:  "./data/processed/ood_stats.npz"
  pose_buffer_size: 5
  bio_buffer_size: 20
  smooth_window: 5

export:
  onnx_dir: "./export/onnx/"
  mnn_dir:  "./export/mnn/"

oppo_health:
  enabled: true
  hr_low: 60
  hr_high: 100
  threshold_adjust_range: 0.2

# 原始 OpenSim 数据根目录（可选，与 .b3d 混合使用）
# raw_opensim_root: "/mnt/d/Subjects_Part1_AB06-AB14/"

# 数据版本锁（可复现性）
data_version:
  b3d_hash: ""        # 由 preprocess 阶段自动填充
  raw_hash: ""
  created: ""