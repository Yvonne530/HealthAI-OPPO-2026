plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.healthai.ankle'
    compileSdk 34

    defaultConfig {
        applicationId "com.healthai.ankle"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // OPPO Reno15 Pro: PLV110  1080×2354  Android 16 (API 35)
        // Keep targetSdk=34 for stability; runs fine on API 35+
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Room schema export directory
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Keep model assets uncompressed so MNN can mmap them directly
    aaptOptions {
        noCompress "mnn", "task"
    }

    // Split APKs per ABI to minimize download size
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"   // OPPO Reno15 Pro = arm64-v8a
            universalApk false
        }
    }

    packagingOptions {
        // MNN ships native libs; exclude duplicate META-INF
        pickFirst 'lib/arm64-v8a/libMNN.so'
        pickFirst 'lib/armeabi-v7a/libMNN.so'
        excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    // ── Android core ──────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // ── CameraX ───────────────────────────────────────────────────────────
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"

    // ── MediaPipe Tasks Vision (Pose Landmarker) ───────────────────────────
    implementation 'com.google.mediapipe:tasks-vision:0.10.10'

    // ── MNN Android Runtime ───────────────────────────────────────────────
    // MNN 2.x Maven artifact; includes libMNN.so for arm64-v8a + armeabi-v7a
    implementation 'com.alibaba.android:mnn:2.8.2@aar'
    // If 2.8.2 is not on Maven Central yet, fall back to:
    // implementation 'com.alibaba.android:mnn:1.2.0@aar'

    // ── Room (SQLite ORM) ─────────────────────────────────────────────────
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // ── Coroutines ────────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── PDF generation (built-in android.graphics.pdf.PdfDocument, no extra dep) ──

    // ── Test ──────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}