### ============================================================
### 正式训练配置 (T4×2 GPU - 彻底修复训练跳过版)
### ============================================================

### 模型配置
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct
template: qwen2_vl
do_train: true                # <--- 关键修复：强制开启训练模式
quantization_bit: 4 
quantization_type: nf4
double_quantization: true

### 数据配置
dataset: rehab_train
val_size: 0.0                 # <--- 建议先设为 0，防止它跑去 eval
cutoff_len: 1024              # 降低 cutoff 确保双卡绝对不 OOM
max_samples: 1000
preprocessing_num_workers: 2

### LoRA 配置
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
create_new_adapter: false

### 训练参数
num_train_epochs: 3
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

### 显存优化策略
per_device_train_batch_size: 1
gradient_accumulation_steps: 8 # 稍微减小，让日志刷新快一点
gradient_checkpointing: true
bf16: false
fp16: true
optim: adamw_8bit
ddp_find_unused_parameters: false

### 评估与保存配置（已简化以确保训练启动）
eval_strategy: "no"           # <--- 关键修复：关闭评估，防止跳过训练
save_strategy: steps
save_steps: 100
load_best_model_at_end: false

### 视觉 token 限制
vllm_maxlen: 1024

### 输出与监控
output_dir: /kaggle/working/rehab_lora
save_total_limit: 1
logging_steps: 1              # <--- 改为 1，确保你能立刻看到进度
overwrite_output_dir: true
ddp_timeout: 7200
report_to: none
save_safetensors: true

### 其他优化
seed: 42
data_seed: 42
dataloader_num_workers: 2
dataloader_pin_memory: false
torch_compile: false