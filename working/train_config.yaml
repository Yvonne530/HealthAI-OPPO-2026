### ============================================================
### Qwen2-VL-7B 医疗助手微调配置 (T4×2 GPU 优化 - 已修复参数错误)
### ============================================================

### 模型配置
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct
template: qwen2_vl
# 已移除 visual_inputs (框架根据 template 自动识别)

### 数据配置
dataset: rehab_train
# 已将 val_dataset 修改为 val_size，避免路径/参数名解析错误
val_size: 0.1
cutoff_len: 2048
max_samples: 1000000
preprocessing_num_workers: 2

### LoRA 配置（16GB 显存极限优化）
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
create_new_adapter: false
# 已移除 modules_to_save: [] (LoRA模式下传空列表易报错)

### 训练参数
num_train_epochs: 3
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

### 显存优化策略（T4×2 16GB 关键配置）
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
bf16: false
fp16: true
optim: adamw_8bit
ddp_find_unused_parameters: false

### 评估配置
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
save_strategy: steps
save_steps: 200
load_best_model_at_end: false

### 视觉 token 限制 (针对 Qwen2-VL 的核心显存保护)
# 已移除 qwen2_vl_max_pixels (部分版本不识别)
# 使用通用的 vllm_maxlen 来限制视觉序列长度，防止 OOM
vllm_maxlen: 1024

### 输出与监控
output_dir: /kaggle/working/rehab_lora
save_total_limit: 1
logging_dir: /kaggle/working/rehab_lora/logs
logging_steps: 10
overwrite_output_dir: true
ddp_timeout: 7200
report_to: none
save_safetensors: true
include_num_input_tokens_seen: true

### 其他优化
seed: 42
data_seed: 42
dataloader_num_workers: 2
dataloader_pin_memory: false
torch_compile: false