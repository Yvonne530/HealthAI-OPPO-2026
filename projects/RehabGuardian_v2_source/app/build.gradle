plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.healthai.ankle'
    compileSdk 35

    defaultConfig {
        applicationId "com.healthai.ankle"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }

        // Required for MNN native .so extraction
        ndk {
            abiFilters "arm64-v8a"   // OPPO Reno15 Pro = arm64-v8a only
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding false }

    // Keep .mnn and .task files uncompressed so MNN can mmap them
    aaptOptions {
        noCompress "mnn", "task"
    }

    packagingOptions {
        // Avoid duplicate .so conflicts when MNN AAR + other deps both ship native libs
        pickFirst 'lib/arm64-v8a/libMNN.so'
        pickFirst 'lib/arm64-v8a/libMNNOpenCL.so'
        excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    // ── Android core ──────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'

    // ── CameraX ───────────────────────────────────────────────────────────
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // ── MediaPipe Tasks Vision 0.10.14 (stable, on Maven Central) ─────────
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // ── MNN Android Runtime ───────────────────────────────────────────────
    // MNN is NOT on Maven Central. Use local AAR from GitHub releases.
    // Download: bash scripts/download_mnn_aar.sh
    // Or manually: https://github.com/alibaba/MNN/releases → MNN-x.x.x-release.aar → app/libs/
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // ── Room ──────────────────────────────────────────────────────────────
    def room = "2.6.1"
    implementation "androidx.room:room-runtime:$room"
    implementation "androidx.room:room-ktx:$room"
    kapt "androidx.room:room-compiler:$room"

    // ── Coroutines ────────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ── Test ──────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
